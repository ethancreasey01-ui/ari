<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 350px;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      background: #f5f5f7;
    }
    
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    
    .logo {
      font-size: 24px;
      font-weight: 700;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    
    .status {
      background: white;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    
    .status-title {
      font-weight: 600;
      margin-bottom: 5px;
      font-size: 14px;
    }
    
    .status-text {
      font-size: 13px;
      color: #666;
    }
    
    .status-text.success {
      color: #34c759;
    }
    
    .status-text.error {
      color: #ff3b30;
    }
    
    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 10px;
      font-size: 14px;
      transition: all 0.2s;
    }
    
    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }
    
    .btn-secondary {
      background: #f5f5f7;
      color: #1d1d1f;
    }
    
    .btn-secondary:hover {
      background: #e5e5ea;
    }
    
    .instructions {
      background: white;
      padding: 15px;
      border-radius: 12px;
      margin-top: 15px;
      font-size: 13px;
      line-height: 1.5;
    }
    
    .instructions h3 {
      margin-top: 0;
      font-size: 14px;
    }
    
    .instructions ol {
      padding-left: 20px;
      margin: 10px 0;
    }
    
    .instructions li {
      margin-bottom: 8px;
    }
    
    .footer {
      text-align: center;
      margin-top: 15px;
      font-size: 12px;
      color: #86868b;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">SocialSpark</div>
  </div>
  
  <div class="status" id="status">
    <div class="status-title">Extension Status</div>
    <div class="status-text success" id="statusText">✓ Extension active and ready</div>
  </div>
  
  <button class="btn btn-primary" id="openFacebook">
    Open Facebook
  </button>
  
  <button class="btn btn-secondary" id="openDashboard">
    Open SocialSpark Dashboard
  </button>
  
  <div class="instructions">
    <h3>How to use:</h3>
    <ol>
      <li>Go to your SocialSpark dashboard</li>
      <li>Generate content for your business</li>
      <li>Click "Post to Facebook" button</li>
      <li>Facebook will open with content filled in</li>
      <li>Click "Post" on Facebook to publish</li>
    </ol>
  </div>
  
  <div class="footer">
    SocialSpark AI © 2026
  </div>
  
  <script>
    // Open Facebook
    document.getElementById('openFacebook').addEventListener('click', () => {
      chrome.tabs.create({ url: 'https://www.facebook.com' });
    });
    
    // Open dashboard (default to localhost for now)
    document.getElementById('openDashboard').addEventListener('click', () => {
      chrome.tabs.create({ url: 'http://localhost:8083' });
    });
    
    // Check status
    chrome.runtime.sendMessage({ action: 'ping' }, (response) => {
      if (chrome.runtime.lastError) {
        document.getElementById('statusText').textContent = '✗ Extension error';
        document.getElementById('statusText').className = 'status-text error';
      } else if (response && response.success) {
        document.getElementById('statusText').textContent = '✓ Extension v' + response.version + ' ready';
        document.getElementById('statusText').className = 'status-text success';
      }
    });
  </script>
</body>
</html>
